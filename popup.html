<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row">
      <div class="title">🎅 Santa Pop-In</div>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span>On</span>
      </label>
    </header>

    <section id="body">
      <div class="label row">
        <span>How often</span>
        <span id="freqText" class="muted"></span>
      </div>
      <input id="freq" type="range" min="1" max="5" step="1" />
      <div class="row muted small"><span>Rare</span><span>Often</span></div>

      <div class="label">What Santa gets up to</div>
      <div class="acts">
        <label><input type="checkbox" data-act="peek" /> Peeks in from the side</label>
        <label><input type="checkbox" data-act="walk" /> Strolls across the bottom</label>
        <label><input type="checkbox" data-act="sleigh" /> Reindeer sleigh ride</label>
        <label><input type="checkbox" data-act="cloud" /> Snow cloud with light snow</label>
        <label><input type="checkbox" data-act="canes" /> Drops candy canes</label>
        <label><input type="checkbox" data-act="dance" /> Dances when you click him</label>
        <label><input type="checkbox" data-act="blower" /> Leaf blower (click the snow)</label>
      </div>

      <div class="label">Try it now</div>
      <div class="try">
        <button data-try="peek">Peek</button>
        <button data-try="walk">Walk</button>
        <button data-try="sleigh">Sleigh</button>
        <button data-try="cloud">Cloud</button>
        <button data-try="blower">Blower</button>
      </div>
      <div id="tryMsg" class="muted small"></div>
    </section>

    <footer>
      <a id="tipLink" class="tip" target="_blank" rel="noopener" hidden>Enjoying it? Buy me a coffee ☕</a>
      <a id="brandLink" class="brand" target="_blank" rel="noopener">
        <img src="images/jem6-mark.svg" alt="" width="16" height="16" />
        <span>Built by <b>jem6</b></span>
      </a>
    </footer>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
